name: k6 Performance Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  run-k6-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 performance tests
        uses: grafana/run-k6-action@v1
        with:
          path: ./end-to-end.js